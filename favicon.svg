<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (White to very light blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" rx="40" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="4"/>
  
  <!-- Text Content -->
  <g text-anchor="middle" font-family="Arial, sans-serif, 'Cairo'">
    <!-- تقنية النسيم -->
    <text x="150" y="110" font-size="50" font-weight="900" fill="#0891b2">تقنية النسيم</text>
    
    <!-- Taqnia Al-Naseem -->
    <text x="150" y="165" font-size="28" font-weight="bold" fill="#64748b" letter-spacing="1">Taqnia Al-Naseem</text>
    
    <!-- للتبـريـد والتكيـيـف -->
    <text x="150" y="225" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="2">للتبـريـد والتكيـيـف</text>
  </g>
</svg>